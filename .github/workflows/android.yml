name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rolling trend for the perf budget: each run restores the previous
      # run's size numbers (never a primary-key hit, so it always re-saves),
      # letting every build show its delta against the last one.
      - name: Restore the last build's size numbers
        uses: actions/cache@v4
        with:
          path: perf-history.json
          key: perf-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: perf-history-${{ runner.os }}-${{ github.ref_name }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the site (fresh bundle for the app)
        run: |
          npm ci
          npm run build

      # Catch bundle bloat WHERE IT ENTERS: per-directory ceilings over Vite's
      # per-module size stats (vendor, components, lib, data). Runs before the
      # slow Gradle build so an over-budget bundle fails in seconds, and names
      # the heaviest modules right in the summary.
      - name: Enforce per-directory bundle budgets
        run: |
          BUNDLE_BUDGET_SUMMARY="$GITHUB_STEP_SUMMARY" node scripts/check-bundle-budgets.mjs bundle-stats.json

      # The Android app bundles the built site under android/app/src/main/assets/www.
      # Refresh it from this push's build so the APK always matches the repo head.
      - name: Refresh bundled site assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/. android/app/src/main/assets/www/
          ls android/app/src/main/assets/www

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK (CI debug-signed)
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      # Fail the build if this APK ever loses the motion/animation code (the
      # welcome breathing demo, leaf burst, bottom-tab animation, splash
      # handshake), so a future change can't silently ship a dull app.
      - name: Verify the APK still carries the motion code
        run: |
          bash scripts/verify-apk-motion.sh android/app/build/outputs/apk/debug/app-debug.apk

      # Fail the build if the payload outgrows its budget (APK bytes, gzip'd
      # JS/CSS, font weight) — keeps the app light by default. Limits live in
      # scripts/check-perf-budget.sh; raise them consciously, never silently.
      # Also appends a size report (with Δ vs the last build) to the job summary.
      - name: Enforce the perf budget (size of APK and bundles)
        env:
          PERF_HISTORY: perf-history.json
          PERF_SHA: ${{ github.sha }}
        run: |
          bash scripts/check-perf-budget.sh android/app/build/outputs/apk/debug/app-debug.apk dist

      - name: Stage APK artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/NewLeaf-latest.apk
          ls -la dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: newleaf-android-apk
          path: dist-apk/NewLeaf-latest.apk
          if-no-files-found: error

      # A single rolling release keeps the newest APK attached, so the "latest"
      # link stays stable across pushes.
      - name: Attach APK to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="newleaf-latest"
          RELEASE="New Leaf Android — latest"
          # Remove any previous rolling release/tag so this one points at head.
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          git tag -f "$TAG" "${{ github.sha }}"
          git push origin "$TAG" --force
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$RELEASE" \
            --notes "Auto-built from commit ${{ github.sha }} on ${{ github.ref_name }}. Debug-signed for personal install; data resets on reinstall over an older signature." \
            dist-apk/NewLeaf-latest.apk
          echo "Release URL: $(gh release view "$TAG" --repo "${{ github.repository }}" --json url --jq .url)"
